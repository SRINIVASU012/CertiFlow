version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: certiflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certiflow
      POSTGRES_USER: certiflow_user
      POSTGRES_PASSWORD: certiflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow_user -d certiflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certiflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://certiflow_user:certiflow_password@postgres:5432/certiflow?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: certiflow_super_secret_jwt_key_pragati_skills_2026
      JWT_EXPIRES_IN: 7d
      QUALITY_REVIEW_THRESHOLD: 50
      DELAYED_BATCH_THRESHOLD_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - certiflow_certificates:/app/certificates
      - certiflow_uploads:/app/uploads

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiflow_worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://certiflow_user:certiflow_password@postgres:5432/certiflow?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:5173
      QUALITY_REVIEW_THRESHOLD: 50
      DELAYED_BATCH_THRESHOLD_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - certiflow_certificates:/app/certificates
      - certiflow_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certiflow_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  certiflow_certificates:
  certiflow_uploads:
